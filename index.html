        function applyTheme() {
            document.body.classList.toggle('theme-black', dbSystemSettings.themeColor === 'black');
        }

        let firebaseApp = null;
        let firebaseAuth = null;
        let firebaseDatabase = null;
        let firebaseDataRef = null;
        let firebaseMessagesRef = null;
        let firebaseReady = false;
        let firebaseWriteTimer = null;
        let cloudSyncInProgress = false;
        let knownMessageIds = new Set();
        let notificationAudioContext = null;

        async function prepareNotificationAudio() {
            try {
                notificationAudioContext = notificationAudioContext || new (window.AudioContext || window.webkitAudioContext)();
                if (notificationAudioContext.state === 'suspended') await notificationAudioContext.resume();
            } catch (error) {
                console.warn('Audio browser belum tersedia.', error);
            }
        }

        async function playNotificationSound() {
            if (dbSystemSettings.notificationSound === false) return;
            try {
                await prepareNotificationAudio();
                if (!notificationAudioContext) return;
                const context = notificationAudioContext;
                const now = context.currentTime;
                const volume = Math.min(1, Math.max(0.05, Number(dbSystemSettings.notificationVolume) || 0.35));
                const notes = [
                    { frequency: 1046.5, start: 0, duration: 0.16 },
                    { frequency: 1318.5, start: 0.09, duration: 0.24 }
                ];
                notes.forEach(note => {
                    const gain = context.createGain();
                    const oscillator = context.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(note.frequency, now + note.start);
                    gain.gain.setValueAtTime(0.0001, now + note.start);
                    gain.gain.exponentialRampToValueAtTime(volume * 0.55, now + note.start + 0.012);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + note.start + note.duration);
                    oscillator.connect(gain);
                    gain.connect(context.destination);
                    oscillator.start(now + note.start);
                    oscillator.stop(now + note.start + note.duration + 0.02);
                });
            } catch (error) {
                console.warn('Suara notifikasi tidak tersedia di browser ini.', error);
            }
        }

        function updateKnownMessages(messages) {
            knownMessageIds = new Set((messages || []).map(message => String(message.id)));
        }

        function notifyForNewMessages(messages) {
            const incomingMessages = (messages || []).filter(message =>
                currentUser && message.recipient === currentUser.username &&
                message.sender !== currentUser.username && !knownMessageIds.has(String(message.id))
            );
            updateKnownMessages(messages);
            if (incomingMessages.length > 0) playNotificationSound();
            return incomingMessages.length > 0;
        }

        function getDatabaseSnapshot() {
            return {
                users: dbUsers,
                sekolah: dbSekolah,
                supervisi: dbSupervisi,
                kelayakan: dbKelayakan,
                identitasPengawas: dbIdentitasPengawas,
                identitas: dbIdentitas,
                adminKop: dbAdminKop,
                systemSettings: dbSystemSettings,
                firebaseSettings: dbFirebaseSettings
            };
        }

        function normalizeMessages(messages) {
            if (Array.isArray(messages)) return messages;
            return messages ? Object.values(messages) : [];
        }

        function applyDatabaseSnapshot(snapshot, includeMessages = true) {
            if (!snapshot) return;
            if (snapshot.users) dbUsers = snapshot.users;
            if (snapshot.sekolah) dbSekolah = snapshot.sekolah;
            if (snapshot.supervisi) dbSupervisi = snapshot.supervisi;
            if (snapshot.kelayakan) dbKelayakan = snapshot.kelayakan;
            if (snapshot.identitasPengawas) dbIdentitasPengawas = snapshot.identitasPengawas;
            if (snapshot.identitas) dbIdentitas = snapshot.identitas;
            if (snapshot.adminKop) dbAdminKop = snapshot.adminKop;
            if (includeMessages && snapshot.messages) dbMessages = normalizeMessages(snapshot.messages);
            if (snapshot.systemSettings) dbSystemSettings = snapshot.systemSettings;
            if (snapshot.firebaseSettings) dbFirebaseSettings = snapshot.firebaseSettings;
            if (currentUser) {
                const refreshedUser = dbUsers.find(user => user.username === currentUser.username);
                if (refreshedUser) currentUser = refreshedUser;
            }
        }

        function isCloudConfigured() {
            return Boolean(dbFirebaseSettings.apiKey && dbFirebaseSettings.projectId && dbFirebaseSettings.databaseURL);
        }

        function initializeFirebase() {
            if (!isCloudConfigured() || firebaseReady) return;
            try {
                firebaseApp = firebase.initializeApp(dbFirebaseSettings);
                firebaseAuth = firebase.auth();
                firebaseDatabase = firebase.database();
                firebaseAuth.signInAnonymously().then(() => {
                    firebaseReady = true;
                    firebaseDataRef = firebaseDatabase.ref('pantau/database');
                    firebaseMessagesRef = firebaseDataRef.child('messages');
                    firebaseDataRef.on('value', snapshot => {
                        const remoteData = snapshot.val();
                        if (!remoteData) {
                            scheduleCloudSync();
                            return;
                        }
                        applyDatabaseSnapshot(remoteData);
                        saveData(false);
                        if (currentUser) render();
                    }, error => console.error('Gagal membaca Firebase:', error));
                    firebaseMessagesRef.on('value', snapshot => {
                        const remoteMessages = normalizeMessages(snapshot.val());
                        if (remoteMessages.length > 0) {
                            notifyForNewMessages(remoteMessages);
                            dbMessages = remoteMessages;
                            saveData(false);
                            if (currentUser) render();
                        } else if (dbMessages.length > 0) {
                            firebaseMessagesRef.set(Object.fromEntries(dbMessages.map(message => [String(message.id), message])));
                        }
                    }, error => console.error('Gagal membaca pesan realtime:', error));
                    scheduleCloudSync();
                }).catch(error => console.error('Autentikasi Firebase gagal:', error));
            } catch (error) {
                console.error('Konfigurasi Firebase tidak valid:', error);
            }
        }

        function writeCloudDatabase() {
            if (!firebaseReady || !firebaseDataRef || cloudSyncInProgress) return;
            cloudSyncInProgress = true;
            firebaseDataRef.update(getDatabaseSnapshot()).then(() => {
                dbFirebaseSettings.status = 'Connected';
                saveData(false);
            }).catch(error => {
                dbFirebaseSettings.status = 'Error';
                console.error('Gagal menyimpan ke Firebase:', error);
            }).finally(() => cloudSyncInProgress = false);
        }

        function scheduleCloudSync() {
            if (!isCloudConfigured()) return;
            clearTimeout(firebaseWriteTimer);
            firebaseWriteTimer = setTimeout(writeCloudDatabase, 300);
        }

        function initializeCloudSync() {
            initializeFirebase();
        }

        function saveData(syncCloud = true) {
            try {
                localStorage.setItem('pantau_ai_users', JSON.stringify(dbUsers));
                localStorage.setItem('pantau_ai_sekolah', JSON.stringify(dbSekolah));
                localStorage.setItem('pantau_ai_supervisi', JSON.stringify(dbSupervisi));
                localStorage.setItem('pantau_ai_kelayakan', JSON.stringify(dbKelayakan));
                localStorage.setItem('pantau_ai_identitas_pengawas', JSON.stringify(dbIdentitasPengawas));
                localStorage.setItem('pantau_ai_identitas', JSON.stringify(dbIdentitas));
                localStorage.setItem('pantau_ai_admin_kop', JSON.stringify(dbAdminKop));
                localStorage.setItem('pantau_ai_messages', JSON.stringify(dbMessages));
                localStorage.setItem('pantau_ai_system_settings', JSON.stringify(dbSystemSettings));
                localStorage.setItem('pantau_ai_firebase_settings', JSON.stringify(dbFirebaseSettings));
                updateFaviconInDom();
                applyTheme();
                if (syncCloud) scheduleCloudSync();
            } catch (err) {
                console.error("Gagal menyimpan ke localStorage:", err);
            }
        }

        function updateFaviconInDom() {
            if (dbSystemSettings.faviconUrl) {
                let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/x-icon';
                link.rel = 'shortcut icon';
                link.href = dbSystemSettings.faviconUrl;
                document.getElementsByTagName('head')[0].appendChild(link);
            }
        }

        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            const iconEl = document.getElementById('modalIcon');
            if (type === 'success') {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i>';
                iconEl.className = 'text-3xl mb-3 inline-flex p-3.5 rounded-2xl bg-emerald-50 text-emerald-600 shadow-inner';

        function closeResetPasswordModal() {
            document.getElementById('resetPasswordModal').classList.add('hidden');

            e.preventDefault();
            const newPass = document.getElementById('newPasswordInput').value.trim();

            if (u) {

        function switchTab(mode) {
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegBtn');

            const regView = document.getElementById('formRegView');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2.5 text-xs font-bold uppercase tracking-wider rounded-lg bg-white text-blue-600 shadow-sm transition-all";
                regBtn.className = "flex-1 py-2.5 text-xs font-bold uppercase tracking-wider rounded-lg text-slate-500 hover:text-slate-800 transition-all";
                loginView.classList.remove('hidden');
                regView.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-2.5 text-xs font-bold uppercase tracking-wider rounded-lg bg-white text-emerald-600 shadow-sm transition-all";
                loginBtn.className = "flex-1 py-2.5 text-xs font-bold uppercase tracking-wider rounded-lg text-slate-500 hover:text-slate-800 transition-all";
                regView.classList.remove('hidden');
                loginView.classList.add('hidden');
            }
        }

        function toggleRegFields() {
            const role = document.getElementById('regRole').value;
            const fieldSekolah = document.getElementById('fieldSekolah');
            if (role === 'kepsek') fieldSekolah.classList.remove('hidden');
            else fieldSekolah.classList.add('hidden');
        }

        function prepareChatForUser(user) {
            const otherUsers = dbUsers.filter(account => account.username !== user.username);
            const unreadMessage = dbMessages
                .filter(message => message.recipient === user.username && message.sender !== user.username)
                .sort((first, second) => new Date(second.timestamp) - new Date(first.timestamp))[0];
            currentChatRecipient = unreadMessage?.sender || otherUsers[0]?.username || '';
            if (!unreadMessage) return;
            if (user.role === 'pengawas') activePengawasTab = 'pesan';
            if (user.role === 'kepsek') activeKepsekTab = 'pesan';
            if (user.role === 'admin' || user.role === 'admin_dinas') activeAdminTab = 'chat';
        }

        function restoreUserSession() {
            try {
                const savedSession = JSON.parse(localStorage.getItem('pantau_ai_session') || 'null');
                if (!savedSession?.username) return;
                const savedUser = dbUsers.find(user => user.username === savedSession.username);
                if (savedUser) {
                    currentUser = savedUser;
                    prepareChatForUser(currentUser);
                }
            } catch (error) {
                localStorage.removeItem('pantau_ai_session');
                console.warn('Sesi pengguna tidak dapat dipulihkan.', error);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const found = dbUsers.find(x => x.username === u && x.password === p);
            
            if (found) {
                if (dbSystemSettings.maintenanceMode && found.role !== 'admin' && found.role !== 'admin_dinas') {
                    showModal('Pemeliharaan Sistem', 'Sistem sedang dalam mode pemeliharaan. Hanya Administrator yang dapat masuk.', 'error');
                    return;
                }
                currentUser = dbUsers.find(user => user.username === found.username) || found;
                localStorage.setItem('pantau_ai_session', JSON.stringify({ username: currentUser.username }));
                prepareChatForUser(currentUser);
                prepareNotificationAudio();
                showModal('Berhasil Masuk', `Selamat datang kembali, ${found.nama}`, 'success');
                setTimeout(() => { closeModal(); render(); }, 600);
            } else {
                showModal('Login Gagal', 'Username atau password yang Anda masukkan salah.', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const role = document.getElementById('regRole').value;
            const nama = document.getElementById('regNama').value.trim();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            const sekolah = role === 'kepsek' ? (document.getElementById('regSekolah')?.value.trim() || '') : '';
            const npsn = role === 'kepsek' ? (document.getElementById('regNpsn')?.value.trim() || '') : '';

            if (dbUsers.some(x => x.username === username)) {
                showModal('Peringatan', 'Username sudah terdaftar dalam sistem.', 'error');
                return;
            }

            dbUsers.push({ username, password, role, nama, sekolah, npsn });
            if (role === 'kepsek') {
                dbSekolah.push({ id: Date.now(), npsn, namaSekolah: sekolah, namaKepsek: nama, alamat: 'Belum diisi', pengawasId: 'pengawas1' });
            }
            saveData();
            showModal('Registrasi Sukses', 'Akun berhasil dibuat. Silakan masuk.', 'success');
            switchTab('login');
        }

        function printKelayakanPdfDirect() {
            const content = document.getElementById('kelayakanPdfContainer').innerHTML;
            const printWindow = window.open('', '', 'height=800,width=800');
            printWindow.document.write('<html><head><title>Cetak Kelayakan Kepala Sekolah</title>');
            printWindow.document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
            printWindow.document.write('<style>body { font-family: Inter, sans-serif; background: #fff; padding: 20px; }</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(content);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 500);
        }

        function downloadExcelTemplate() {
            const templateData = [
                { NPSN: "20605954", Nama_Sekolah: "SDN KAMASAN 1", Kepala_Sekolah: "IIS AISAH, M.Pd.", Alamat: "Kp. Ciparay Ds. Kamasan" }
            ];
            const worksheet = XLSX.utils.json_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Sekolah & Kepsek");
            XLSX.writeFile(workbook, "PANTAU_Template_Sekolah.xlsx");
            showModal('Berhasil', 'Template Excel berhasil diunduh ke perangkat Anda.', 'success');
        }

        function handleImportExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    let count = 0;
                    json.forEach(row => {
                        const npsn = row['NPSN'] || row['npsn'];
                        const namaSekolah = row['Nama_Sekolah'] || row['Nama Sekolah'] || row['nama_sekolah'];
                        const namaKepsek = row['Kepala_Sekolah'] || row['Kepala Sekolah'] || row['nama_kepsek'];
                        const alamat = row['Alamat'] || row['alamat'] || '-';

                        if (npsn && namaSekolah) {
                            dbSekolah.push({
                                id: Date.now() + Math.random(),
                                npsn: String(npsn),
                                namaSekolah: String(namaSekolah),
                                namaKepsek: String(namaKepsek || 'Belum Diatur'),
                                alamat: String(alamat),
                                pengawasId: currentUser.username
                            });
                            count++;
                        }
                    });

                    saveData();
                    showModal('Import Berhasil', `Berhasil memasukkan ${count} data sekolah dan kepala sekolah baru.`, 'success');
                    render();
                } catch(err) {
                    showModal('Gagal', 'Format file tidak sesuai dengan template PANTAU.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

                saveData();

            }
        }

        let kepsekPhotoUrlTemp = '';

        function previewKepsekPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                kepsekPhotoUrlTemp = evt.target.result;
                const prev = document.getElementById('kepsekPhotoPreview');
                if (prev) prev.innerHTML = '<img src="' + kepsekPhotoUrlTemp + '" class="w-full h-full object-cover" />';
            };
            reader.readAsDataURL(file);
        }

        function handleSaveIdentitasKepsek(e) {
            e.preventDefault();
            const uKey = currentUser.username;
            const existing = dbIdentitas[uKey] || {};
            dbIdentitas[uKey] = {
                nama: document.getElementById('ik_nama').value,
                nip: document.getElementById('ik_nip').value,
                ttl: document.getElementById('ik_ttl').value,
                pangkat: document.getElementById('ik_pangkat').value,
                tmt: document.getElementById('ik_tmt').value,
                masaKerja: document.getElementById('ik_masaKerja').value,
                gender: document.getElementById('ik_gender').value,
                pendidikan: document.getElementById('ik_pendidikan').value,
                satuan: document.getElementById('ik_satuan').value,
                kelurahan: document.getElementById('ik_kelurahan').value,
                kecamatan: document.getElementById('ik_kecamatan').value,
                kab: document.getElementById('ik_kab').value,
                prov: document.getElementById('ik_prov').value,
                photoUrl: kepsekPhotoUrlTemp || existing.photoUrl || ''
            };
            saveData();
            showModal('Berhasil', 'Formulir Identitas Kepala Sekolah berhasil disimpan.', 'success');
            render();
        }

        function renderChatTab() {
            const availableRecipients = dbUsers.filter(user => user.username !== currentUser.username);
            if (!availableRecipients.some(user => user.username === currentChatRecipient)) {
                currentChatRecipient = availableRecipients[0]?.username || '';
            }
            const recipientUsername = currentChatRecipient;
            const recipient = availableRecipients.find(user => user.username === recipientUsername);
            const recipientName = recipient?.nama || 'Pilih penerima pesan';

            const conversation = dbMessages.filter(m => (m.sender === currentUser.username && m.recipient === recipientUsername) || (m.sender === recipientUsername && m.recipient === currentUser.username));
            conversation.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            return `
                <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 flex flex-col h-[75vh] max-w-4xl mx-auto animate-fade-in overflow-hidden">
                    <div class="p-5 border-b border-slate-100 bg-slate-50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">

                            </div>
                        </div>
                        
                        <div class="w-full sm:w-auto sm:min-w-[260px]">
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Pilih penerima</label>
                            <select onchange="setChatRecipient(this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700 outline-none focus:border-blue-600">
                                ${availableRecipients.length === 0 ? '<option value="">Belum ada akun lain</option>' : availableRecipients.map(user => `<option value="${user.username}" ${user.username === recipientUsername ? 'selected' : ''}>${user.nama || user.username} - ${user.role}</option>`).join('')}

                    </div>

                        ${conversation.length === 0 ? `
                            <div class="text-center py-12 text-slate-400 text-xs">Belum ada riwayat pesan. Kirim pesan gelembung pertama Anda di bawah ini.</div>
                        ` : conversation.map(m => {
                            const isMe = m.sender === currentUser.username;
                            return `
                                <div class="flex ${isMe ? 'justify-end' : 'justify-start'} animate-fade-in">
                                    <div class="max-w-[80%] sm:max-w-[70%] p-4 rounded-2xl shadow-sm text-xs sm:text-sm ${isMe ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}">
                                        <div class="font-bold mb-1 text-[10px] ${isMe ? 'text-blue-200' : 'text-slate-500'}">${m.senderName}</div>
                                        <p class="leading-relaxed whitespace-pre-wrap">${m.message}</p>
                                        <div class="text-[9px] mt-2 text-right ${isMe ? 'text-blue-100' : 'text-slate-400'}">${m.timestamp.substring(11, 16)}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="p-4 bg-white border-t border-slate-100">

                            <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-6 py-3.5 rounded-2xl font-bold text-xs sm:text-sm transition shadow-lg shadow-blue-600/25 flex items-center gap-2">

                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInputMessage');
            const text = input.value.trim();
            if (!text) return;
            const recipientUser = currentChatRecipient;
            if (!recipientUser || recipientUser === currentUser.username) return;

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const timestamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const newMessage = {
                id: Date.now(),
                sender: currentUser.username,
                senderName: currentUser.nama,
                recipient: recipientUser,
                message: text,
                timestamp
            };
            dbMessages.push(newMessage);

            saveData(false);
            if (firebaseReady && firebaseMessagesRef) {
                firebaseMessagesRef.child(String(newMessage.id)).set(newMessage)
                    .catch(error => console.error('Gagal mengirim pesan realtime:', error));
            } else {
                scheduleCloudSync();
            }
            input.value = '';
            render();

            setTimeout(() => {
                const container = document.getElementById('chatMessagesContainer');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        }

                            </button>

                                    <button onclick="setAdminTab('kop')" class="w-full px-4 py-3 rounded-2xl text-left font-bold text-xs transition flex items-center space-x-3 ${activeAdminTab === 'kop' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-600/30' : 'text-slate-600 hover:bg-slate-100/80'}">
                                        <i class="fa-solid fa-image text-base w-5 text-center"></i><span>Kop & Logo Dinas</span>
                                    </button>
                                    <button onclick="setAdminTab('firebase')" class="w-full px-4 py-3 rounded-2xl text-left font-bold text-xs transition flex items-center space-x-3 ${activeAdminTab === 'firebase' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg shadow-amber-600/30' : 'text-slate-600 hover:bg-slate-100/80'}">
                                        <i class="fa-solid fa-cloud text-base w-5 text-center"></i><span>Server Cloud Firebase</span>
                                    </button>
                                    <button onclick="setAdminTab('chat')" class="w-full px-4 py-3 rounded-2xl text-left font-bold text-xs transition flex items-center space-x-3 ${activeAdminTab === 'chat' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-600/30' : 'text-slate-600 hover:bg-slate-100/80'}">
                                        <i class="fa-solid fa-comments text-base w-5 text-center"></i><span>Pesan & Bantuan</span>
                                    </button>
                                </nav>
                            </div>
                        </aside>
                    </div>
                </div>
            `;
        }

        let adminLogoUrlTemp = dbAdminKop.logoUrl || '';
        let sipantauLogoUrlTemp = dbSystemSettings.sipantauLogoUrl || '';
        let faviconUrlTemp = dbSystemSettings.faviconUrl || '';

        function previewAdminLogo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                adminLogoUrlTemp = evt.target.result;
                const prev = document.getElementById('adminLogoPreview');
                if (prev) prev.innerHTML = '<img src="' + adminLogoUrlTemp + '" class="w-full h-full object-contain" />';
            };
            reader.readAsDataURL(file);
        }

        function previewSipantauLogo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                sipantauLogoUrlTemp = evt.target.result;
                const prev = document.getElementById('sipantauLogoPreview');
                if (prev) prev.innerHTML = '<img src="' + sipantauLogoUrlTemp + '" class="w-full h-full object-contain" />';
            };
            reader.readAsDataURL(file);
        }

        function previewFavicon(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                faviconUrlTemp = evt.target.result;
                const prev = document.getElementById('faviconPreview');
                if (prev) prev.innerHTML = '<img src="' + faviconUrlTemp + '" class="w-full h-full object-contain" />';
            };
            reader.readAsDataURL(file);
        }

        function handleSaveAdminKop(e) {
            e.preventDefault();
            dbAdminKop = {
                pemda: document.getElementById('ak_pemda').value.trim(),
                dinas: document.getElementById('ak_dinas').value.trim(),
                kecamatan: document.getElementById('ak_kecamatan').value.trim(),
                alamat: document.getElementById('ak_alamat').value.trim(),
                logoUrl: adminLogoUrlTemp
            };
            saveData();
            showModal('Berhasil', 'Konfigurasi Kop & Logo Dinas berhasil disimpan.', 'success');
        }

        function handleSaveTheme(e) {
            e.preventDefault();
            const selectedTheme = document.querySelector('input[name="themeColor"]:checked')?.value || 'blue';
            dbSystemSettings.themeColor = selectedTheme;
            if (sipantauLogoUrlTemp) dbSystemSettings.sipantauLogoUrl = sipantauLogoUrlTemp;
            if (faviconUrlTemp) dbSystemSettings.faviconUrl = faviconUrlTemp;
            saveData();
            applyTheme();
            showModal('Berhasil', 'Preferensi Tema & Logo berhasil disimpan.', 'success');
            render();
        }

        function handleSaveSystemSettings(e) {
            e.preventDefault();
            dbSystemSettings.announcementMessage = document.getElementById('sys_announcement').value.trim();
            dbSystemSettings.maintenanceMode = document.getElementById('sys_maintenance').checked;
            dbSystemSettings.notificationSound = document.getElementById('sys_notificationSound').checked;
            dbSystemSettings.notificationVolume = Number(document.getElementById('sys_notificationVolume').value) || 0.35;
            saveData();
            showModal('Berhasil Disimpan', 'Pengaturan sistem & pengumuman berhasil diperbarui.', 'success');
            render();
        }

        function handleSaveGoogleDriveSettings(e) {
            e.preventDefault();
            dbFirebaseSettings.apiKey = document.getElementById('gd_clientId').value.trim();
            dbFirebaseSettings.projectId = document.getElementById('gd_apiKey').value.trim();
            dbFirebaseSettings.databaseURL = document.getElementById('gd_folderName').value.trim().replace(/\/$/, '');
            saveData();
            showModal('Berhasil Disimpan', 'Konfigurasi Firebase berhasil disimpan. Klik Hubungkan untuk memulai sinkronisasi realtime.', 'success');
            render();
        }

        function connectGoogleDriveAccount() {
            if (!isCloudConfigured()) {
                showModal('Konfigurasi Belum Lengkap', 'Isi API Key, Project ID, dan Database URL Firebase terlebih dahulu.', 'error');
                return;
            }
            showModal('Menghubungkan', 'Mengaktifkan sinkronisasi Firebase realtime...', 'info');
            initializeFirebase();
            setTimeout(() => {
                if (firebaseReady) {
                    dbFirebaseSettings.status = 'Connected';
                    saveData(false);
                    showModal('Berhasil Terhubung', 'Database PANTAU dan chat realtime sudah aktif.', 'success');
                } else showModal('Koneksi Gagal', 'Firebase belum siap. Periksa konfigurasi dan Security Rules.', 'error');
                render();
            }, 1200);
        }

        function syncDataToGoogleDrive() {
            if (!isCloudConfigured()) {
                showModal('Konfigurasi Belum Lengkap', 'Isi konfigurasi Firebase terlebih dahulu.', 'error');
                return;
            }
            initializeFirebase();
            setTimeout(() => {
                writeCloudDatabase();
                showModal('Sinkronisasi Dimulai', 'Data sedang dikirim ke Firebase Realtime Database.', 'success');
            }, 500);
        }

        function showAddUserModal() {
            const nama = prompt('Masukkan Nama Lengkap & Gelar:');
            if (!nama) return;
            const username = prompt('Masukkan Username baru:');
            if (!username) return;
            const password = prompt('Masukkan Password:');
            if (!password) return;
            const role = prompt('Masukkan Role (pengawas / kepsek / admin_dinas / admin):', 'kepsek');
            if (!role || (role !== 'pengawas' && role !== 'kepsek' && role !== 'admin_dinas' && role !== 'admin')) {
                showModal('Peringatan', 'Role harus pengawas, kepsek, admin_dinas, atau admin.', 'error');
                return;
            }

            if (dbUsers.some(x => x.username === username)) {
                showModal('Peringatan', 'Username sudah terdaftar dalam sistem.', 'error');
                return;
            }

            dbUsers.push({ username, password, role, nama, sekolah: role === 'kepsek' ? 'SDN BARU' : '', npsn: role === 'kepsek' ? '20600000' : '' });
            saveData();
            showModal('Berhasil', 'Akun pengguna baru berhasil ditambahkan.', 'success');
            render();
        }

        function deleteUser(username) {
            if (window.confirm(`Hapus akun pengguna "${username}" dari sistem?`)) {
                dbUsers = dbUsers.filter(x => x.username !== username);
                saveData();
                render();
            }
        }

        window.onload = function() {
            applyTheme();
            restoreUserSession();
            render();
            initializeCloudSync();
        };
    </script>
</body>
</html>
